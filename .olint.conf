#!/usr/bin/env bash
# This is sourced. Fake bang-path to help editors and linters

skip_linters+=(
    markdownlint # doesn't support exclude directive will fail if used as project linter
)

excluded_prefixes+=(
    screenshots/
)

excludes+=(
    battery_enabled.tmux
    scripts/battery_charging_watts.sh
    scripts/battery_icon_status.sh
    scripts/battery_color_charge.sh
    scripts/battery_icon.sh
    scripts/battery_color_status.sh
    scripts/battery_percentage.sh
    scripts/battery_color.sh
    scripts/battery_remain.sh
    scripts/battery_graph.sh
    scripts/battery_icon_charge.sh
    scripts/helpers.sh

    battery.tmux
    CHANGELOG.md
    LICENSE.md
    README.md
)

# markdownlint doesn't support file exclussion, so if used as a
# project linter this will fail due to the messy markdown files

